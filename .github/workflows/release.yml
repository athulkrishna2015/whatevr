name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.5
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release artifacts and AUR
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 90
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git openssh sudo base-devel go just zstd python libjpeg-turbo
          useradd -m -G wheel builduser
          printf 'builduser ALL=(ALL) NOPASSWD: ALL\n' >> /etc/sudoers

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The source tarball carries the vaxis fork, and whattui needs it.
          submodules: recursive
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build release artifacts
        run: just artifacts x86_64

      - name: Record the source tarball checksum
        id: source
        run: printf 'sha=%s\n' "$(awk '/\.tar\.gz$/ { print $1; exit }' build/SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Write release notes from tag
        id: release-notes
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          case "$RELEASE_TAG" in
            v*) ;;
            *) printf 'release tag %s does not start with v\n' "$RELEASE_TAG" >&2; exit 1 ;;
          esac

          if [ "$(git cat-file -t "$RELEASE_TAG")" != tag ]; then
            printf 'release tag %s is not annotated\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          body="$(git for-each-ref "refs/tags/$RELEASE_TAG" --format='%(contents:body)')"
          if [ -z "${body//[[:space:]]/}" ]; then
            printf 'release tag %s has no annotated body\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          printf '%s\n' "$body" > "$notes"
          printf 'path=%s\n' "$notes" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.release-notes.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            build/whatevr-*.tar.gz
            build/whatevr-*.tar.zst
            build/SHA256SUMS

      - name: Render release AUR packages
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          VERSION="${RELEASE_TAG#v}"
          SOURCE_SHA="$(awk '/\.tar\.gz$/ { print $1; exit }' build/SHA256SUMS)"
          BIN_SHA_X86_64="$(awk '/linux-x86_64\.tar\.zst$/ { print $1; exit }' build/SHA256SUMS)"
          python3 scripts/render_aur_release.py \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --bin-sha-x86_64 "$BIN_SHA_X86_64"

      - name: Configure AUR SSH
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          install -d -m 700 -o builduser -g builduser /home/builduser/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > /home/builduser/.ssh/aur
          chown builduser:builduser /home/builduser/.ssh/aur
          chmod 600 /home/builduser/.ssh/aur
          ssh-keyscan -H aur.archlinux.org > /home/builduser/.ssh/known_hosts
          cat > /home/builduser/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile /home/builduser/.ssh/aur
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile /home/builduser/.ssh/known_hosts
            BatchMode yes
          EOF
          chown builduser:builduser /home/builduser/.ssh/config /home/builduser/.ssh/known_hosts
          chmod 600 /home/builduser/.ssh/config /home/builduser/.ssh/known_hosts
          sudo -H -u builduser ssh aur@aur.archlinux.org help >/dev/null

      - name: Push AUR packages
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          mkdir -p "$RUNNER_TEMP/aur"
          chown builduser:builduser "$RUNNER_TEMP/aur"
          for pkg in whatevr whatevr-git whatevr-bin; do
            aur_dir="$RUNNER_TEMP/aur/$pkg"
            sudo -H -u builduser git -c init.defaultBranch=master clone "ssh://aur@aur.archlinux.org/$pkg.git" "$aur_dir"
            sudo -H -u builduser git -C "$aur_dir" checkout -B master
            install -Dm644 -o builduser -g builduser \
              "$GITHUB_WORKSPACE/packaging/aur/$pkg/PKGBUILD" "$aur_dir/PKGBUILD"
            install -Dm644 -o builduser -g builduser \
              "$GITHUB_WORKSPACE/packaging/aur/$pkg/whatevr.install" "$aur_dir/whatevr.install"
            sudo -H -u builduser sh -c 'cd "$1" && makepkg --printsrcinfo > .SRCINFO' sh "$aur_dir"

            sudo -H -u builduser git -C "$aur_dir" config user.name 'whatevr-release-bot'
            sudo -H -u builduser git -C "$aur_dir" config user.email 'harsh+bot@codelif.in'
            sudo -H -u builduser git -C "$aur_dir" add PKGBUILD .SRCINFO whatevr.install
            if sudo -H -u builduser git -C "$aur_dir" diff --cached --quiet; then
              continue
            fi

            sudo -H -u builduser git -C "$aur_dir" commit -m "Update to $RELEASE_TAG"
            sudo -H -u builduser git -C "$aur_dir" push origin HEAD:master
          done

  macos:
    name: Darwin ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: whatevrd/go.mod
          cache-dependency-path: whatevrd/go.sum
      - name: Install native build dependencies
        run: brew install just jpeg-turbo pkgconf
      - name: Build the darwin tarball
        run: |
          just _binary-tarball ${{ matrix.arch }}
          test "$(just version)" = "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: build/whatevr-*-darwin-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  tap:
    name: Darwin release assets and Homebrew tap
    needs: [release, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SOURCE_SHA: ${{ needs.release.outputs.source-sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: darwin-*
          path: build
          merge-multiple: true
      - name: Write darwin checksums
        run: cd build && sha256sum whatevr-*-darwin-*.tar.gz > SHA256SUMS-darwin && cat SHA256SUMS-darwin
      - name: Publish darwin release assets
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            build/whatevr-*-darwin-*.tar.gz
            build/SHA256SUMS-darwin
      - name: Render Homebrew packages
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 scripts/render_brew_release.py \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --arm64-sha "$(awk '/darwin-arm64\.tar\.gz$/ { print $1 }' build/SHA256SUMS-darwin)" \
            --amd64-sha "$(awk '/darwin-amd64\.tar\.gz$/ { print $1 }' build/SHA256SUMS-darwin)" \
            --tap "$RUNNER_TEMP/rendered"
      - name: Push the tap
        if: env.HOMEBREW_TAP_SSH_KEY != ''
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HOMEBREW_TAP_SSH_KEY" | tr -d '\r' > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes"
          tap="$RUNNER_TEMP/tap"
          git -c init.defaultBranch=main clone git@github.com:codelif/homebrew-tap.git "$tap"
          git -C "$tap" checkout -B main
          cp -R "$RUNNER_TEMP/rendered/." "$tap/"
          git -C "$tap" config user.name 'whatevr-release-bot'
          git -C "$tap" config user.email 'harsh+bot@codelif.in'
          git -C "$tap" add Formula/whatevr.rb Casks/whatevr.rb
          if git -C "$tap" diff --cached --quiet; then
            exit 0
          fi
          git -C "$tap" commit -m "whatevr $RELEASE_TAG"
          git -C "$tap" push origin HEAD:main
