name: Cross-platform artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag to build, for example v0.8.7
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.0
          host: windows
          target: desktop
          arch: ${{ matrix.arch == 'arm64' && 'win64_msvc2022_arm64' || 'win64_msvc2022_64' }}
          modules: qtmultimedia
      - name: Configure
        shell: pwsh
        run: cmake -S whatkevr -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/windows --parallel 3
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/bin/whatkevr.exe -DestinationPath build/whatevr-${env:RELEASE_TAG}-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: build/*.zip

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.0
          host: mac
          target: desktop
          arch: ${{ matrix.arch }}
          modules: qtmultimedia
      - name: Configure
        run: cmake -S whatkevr -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
      - name: Build
        run: cmake --build build/macos --parallel 3
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/bin/whatkevr build/whatevr-${RELEASE_TAG}-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: build/*.zip

  linux-appimages:
    name: Linux AppImage ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build native artifact
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu_latest
          githubToken: ${{ github.token }}
          install: >-
            apt-get update && apt-get install -y git golang cmake ninja-build
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev
          run: |
            just artifacts ${{ matrix.arch == 'aarch64' && 'aarch64' || 'x86_64' }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: build/whatevr-*${{ matrix.arch }}*

  linux-packages:
    name: Linux package recipes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build AppImage, deb, Snap, and Flatpak when toolchains are available
        run: |
          sudo apt-get update
          sudo apt-get install -y appimage-builder dpkg-dev snapcraft flatpak flatpak-builder
          if test -f packaging/appimage/AppImageBuilder.yml; then appimage-builder --recipe packaging/appimage/AppImageBuilder.yml; fi
          if test -f packaging/snap/snapcraft.yaml; then snapcraft --destructive-mode; fi
          if test -d packaging/flatpak; then flatpak-builder --force-clean build/flatpak packaging/flatpak/*.yml; fi
          if test -f packaging/debian/control; then dpkg-buildpackage -us -uc -b; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/*.AppImage
            build/*.deb
            build/*.snap
            build/*.flatpak
            ../*.deb
          if-no-files-found: ignore

  publish:
    name: Publish cross-platform assets
    needs: [windows, macos, linux-appimages, linux-packages]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Flatten assets
        run: find release-assets -type f -exec cp {} release-assets/ \; 2>/dev/null || true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/**
          fail_on_unmatched_files: false
