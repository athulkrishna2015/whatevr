name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.force.outputs.run == 'true' || steps.filter.outputs.go == 'true' }}
      whattui: ${{ steps.force.outputs.run == 'true' || steps.filter.outputs.whattui == 'true' }}
      build: ${{ steps.force.outputs.run == 'true' || steps.filter.outputs.build == 'true' }}
      aur: ${{ steps.force.outputs.run == 'true' || steps.filter.outputs.aur == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 100
          persist-credentials: false

      - name: Run all checks for scheduled/manual workflows
        id: force
        run: |
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) printf 'run=true\n' >> "$GITHUB_OUTPUT" ;;
            *) printf 'run=false\n' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - 'justfile'
              - 'VERSION'
              - '.gitmodules'
              - 'whatevrd/**'
              - 'platform/**'
              - 'native/macos/**'
              - 'scripts/build-macos'
              - 'scripts/install.py'
              - 'scripts/artifacts.py'
              - 'scripts/check-mock-gate'
              - 'scripts/replay'
              - '.github/workflows/**'
            whattui:
              - 'justfile'
              - '.gitmodules'
              - 'whattui/**'
              # The golden frames are drawn against a real whatevrd in mock
              # mode, so a daemon change can move them.
              - 'whatevrd/**'
              - 'platform/**'
              - 'native/macos/**'
              - 'scripts/build-macos'
              - 'scripts/install.py'
              - 'scripts/artifacts.py'
              - '.github/workflows/**'
            build:
              - 'justfile'
              - 'VERSION'
              - 'PROTOCOL.md'
              - '.gitmodules'
              - 'whatevrd/**'
              - 'platform/**'
              - 'native/macos/**'
              - 'scripts/build-macos'
              - 'scripts/install.py'
              - 'scripts/artifacts.py'
              - 'whattui/**'
              - 'packaging/systemd/**'
              - 'packaging/frontends/**'
              - 'packaging/linux/**'
              - 'packaging/homebrew/**'
              - 'scripts/render_brew_release.py'
              - '.github/workflows/**'
            aur:
              - 'packaging/aur/**'
              - 'scripts/release.py'
              - 'scripts/render_aur_release.py'
              - '.github/workflows/**'

  go:
    name: Go daemon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # whatevrd builds against the whatsmeow fork, which is a submodule.
          submodules: recursive
          persist-credentials: false

      - name: Install libjpeg-turbo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libturbojpeg0-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: whatevrd/go.mod
          cache-dependency-path: whatevrd/go.sum

      - name: Check formatting
        working-directory: whatevrd
        run: |
          files="$(gofmt -l . | grep -v '^whatsmeow/' || true)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Test platform paths
        run: go -C platform test ./...

      - name: Vet
        working-directory: whatevrd
        # sqlite_fts5 enables the FTS5 module in go-sqlite3, required by the
        # message-search index the store creates on open.
        run: go vet -tags sqlite_fts5 ./...

      - name: Test
        working-directory: whatevrd
        run: go test -tags sqlite_fts5 ./...

      - name: Vet mock server
        working-directory: whatevrd
        run: go vet -tags "sqlite_fts5 whatevr_mock" ./...

      - name: Test mock server
        working-directory: whatevrd
        run: go test -tags "sqlite_fts5 whatevr_mock" ./internal/wamock/... ./internal/ingest/...

      - name: Race the new core
        working-directory: whatevrd
        run: go test -tags sqlite_fts5 -race ./internal/core/... ./internal/ingest/...

      - name: Vet and test captures
        working-directory: whatevrd
        run: |
          go vet -tags "sqlite_fts5 whatevr_mock whatevr_capture" ./...
          go test -tags "sqlite_fts5 whatevr_mock whatevr_capture" ./cmd/whatevrd/

      # The fake WhatsApp server overrides whatsmeow's pinned certificate key
      # and trusts a private CA, and a capture holds every message in
      # plaintext. Neither may reach a shipped binary.
      - name: Check mock and capture build gates
        run: scripts/check-mock-gate

      # Captures a synthetic scenario and plays it back through the mock:
      # never the real account.
      - name: Replay self-test
        run: scripts/replay --self-test

      - name: Test the whatsmeow fork
        working-directory: whatevrd/whatsmeow
        run: |
          go vet ./...
          go test ./...

  whattui:
    name: Terminal frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.whattui == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # whattui builds against the vaxis fork, which is a submodule.
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: whattui/go.mod
          cache-dependency-path: whattui/go.sum

      - name: Install libjpeg-turbo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libturbojpeg0-dev

      # The golden frames and the paint benchmarks run against a real daemon
      # speaking to a fake WhatsApp server. Mock mode mutates process-global
      # certificate state, so it exists only behind this tag, and it needs cgo
      # for sqlite.
      - name: Build whatevrd with mock support
        run: |
          CGO_ENABLED=1 go build -buildvcs=false \
            -tags "sqlite_fts5 whatevr_mock" \
            -o "$GITHUB_WORKSPACE/build/mock/whatevrd" ./cmd/whatevrd
          printf 'WHATTUI_WHATEVRD=%s\n' "$GITHUB_WORKSPACE/build/mock/whatevrd" >> "$GITHUB_ENV"
        working-directory: whatevrd

      # internal/textrun measures real glyphs, so its devanagari tests skip on a
      # machine with no face for the script. That is the one package that exists
      # for the writing systems a terminal gets wrong, so give the runner the
      # font and let it run.
      - name: Install a devanagari font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core

      - name: Check formatting
        working-directory: whattui
        run: |
          files="$(gofmt -l . | grep -v '^vaxis/' || true)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Vet
        working-directory: whattui
        run: go vet ./...

      - name: Test
        working-directory: whattui
        run: go test ./...

      # Three goroutines share one model: the protocol client, the view models
      # and the render loop.
      - name: Test under the race detector
        working-directory: whattui
        run: go test -race ./...

      # pawbar shares this fork and compiles it with the tag, so both arms of
      # every capability branch have to keep building.
      - name: Test the vaxis fork
        working-directory: whattui/vaxis
        run: |
          go test ./...
          go test -tags kittyonly ./...
          go vet ./...

  build-arch:
    name: Build and install (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git base-devel go just zstd python libjpeg-turbo desktop-file-utils

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # `just build` builds whattui too, against the vaxis submodule.
          submodules: recursive
          persist-credentials: false

      - name: Mark workspace safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore Go caches
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: arch-go-${{ hashFiles('whatevrd/go.sum') }}
          restore-keys: arch-go-

      - name: Build
        run: just build

      - name: Install smoke test
        run: |
          just install-dev /usr "$RUNNER_TEMP/pkgroot"
          test -f "$RUNNER_TEMP/pkgroot/usr/share/whatevr/frontends/whattui.json"
          test -f "$RUNNER_TEMP/pkgroot/usr/share/icons/hicolor/scalable/apps/whatevr.svg"
          desktop-file-validate "$RUNNER_TEMP/pkgroot/usr/share/applications/whatevr.desktop"

      - name: Show resolved version
        run: just version

  macos:
    name: Native macOS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' || needs.changes.outputs.whattui == 'true' }}
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: whatevrd/go.mod
          cache-dependency-path: |
            whatevrd/go.sum
            whattui/go.sum
      - name: Install native build dependencies
        run: brew install just jpeg-turbo pkgconf ffmpeg
      - name: Build debug and release binaries and notification app
        run: |
          just build
          just build-release
          for profile in debug release; do
            codesign --verify --deep --strict "build/$profile/Whatevr.app"
            plutil -lint "build/$profile/Whatevr.app/Contents/Info.plist"
          done
          test "$(plutil -extract CFBundleIdentifier raw build/release/Whatevr.app/Contents/Info.plist)" = in.codelif.whatevr
          test "$(plutil -extract CFBundleIdentifier raw build/debug/Whatevr.app/Contents/Info.plist)" = in.codelif.whatevr.dev
      - name: Test platform paths
        run: go -C platform test ./...
      - name: Test daemon and development build gates
        run: just test daemon
      - name: Test terminal frontend
        env:
          WHATTUI_WHATEVRD: ${{ github.workspace }}/build/debug/whatevrd
        run: just test whattui
      - name: Vet daemon
        run: go -C whatevrd vet -tags sqlite_fts5 ./...
      - name: Stage installation and removal
        run: |
          just install /usr/local "$RUNNER_TEMP/stage"
          stage="$RUNNER_TEMP/stage/usr/local"
          test -L "$stage/bin/whatevrd"
          test "$(readlink "$stage/bin/whatevrd")" = ../Whatevr.app/Contents/MacOS/whatevrd
          test -x "$stage/bin/whatevrd"
          test -x "$stage/Whatevr.app/Contents/MacOS/Whatevr"
          test -f "$stage/Whatevr.app/Contents/Resources/frontends/whattui.json"
          test -f "$stage/share/whatevr/frontends/whattui.json"
          codesign --verify --deep --strict "$stage/Whatevr.app"
          test ! -e "$stage/libexec"
          test ! -d "$stage/lib/systemd"
          just uninstall /usr/local "$RUNNER_TEMP/stage"
          test ! -e "$stage/bin/whatevrd"
          test ! -L "$stage/bin/whatevrd"
          test ! -e "$stage/Whatevr.app"
          test ! -e "$stage/share/whatevr"
      - name: Leave no test sockets behind
        run: |
          left="$(find "$(getconf DARWIN_USER_TEMP_DIR)whatevr" -maxdepth 1 -name 'i-*' 2>/dev/null; find /tmp -maxdepth 1 -name 'whattui-mock-*' 2>/dev/null)"
          if [ -n "$left" ]; then printf 'left behind by the tests:\n%s\n' "$left"; exit 1; fi
      - name: Render Homebrew packages into a local tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          just _source-tarball
          just _binary-tarball "$(uname -m)"
          version="$(just version)"
          arch="$(uname -m | sed 's/x86_64/amd64/')"
          source_sha="$(shasum -a 256 "build/whatevr-$version.tar.gz" | cut -d' ' -f1)"
          bin_sha="$(shasum -a 256 "build/whatevr-$version-darwin-$arch.tar.gz" | cut -d' ' -f1)"
          brew tap-new --no-git local/test
          python3 scripts/render_brew_release.py --version "$version" --source-sha "$source_sha" \
            --arm64-sha "$bin_sha" --amd64-sha "$bin_sha" \
            --tap "$(brew --repository local/test)" --url-base "file://$PWD/build"
      - name: Build the formula from source
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install --build-from-source local/test/whatevr
          brew test local/test/whatevr
          prefix="$(brew --prefix local/test/whatevr)"
          test -L "$(brew --prefix)/bin/whatevrd"
          test -x "$(brew --prefix)/bin/whattui"
          codesign --verify --deep --strict "$prefix/Whatevr.app"
          brew uninstall local/test/whatevr
          test ! -e "$(brew --prefix)/bin/whatevrd"
      - name: Install the cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew fetch --cask local/test/whatevr
          # the check below means nothing unless brew quarantined the download
          xattr -p com.apple.quarantine "$(brew --cache --cask local/test/whatevr)"
          brew install --cask local/test/whatevr
          bin="$(brew --prefix)/bin"
          test -x "$bin/whatevrd"
          test -x "$bin/whattui"
          codesign --verify --deep --strict /Applications/Whatevr.app
          for p in /Applications/Whatevr.app "$(readlink "$bin/whattui")"; do
            if xattr -r "$p" | grep -q com.apple.quarantine; then printf '%s is still quarantined\n' "$p"; exit 1; fi
          done
      - name: Login service, socket activation and links, with whatsapp blackholed
        run: |
          set -o pipefail
          # the service runs the real daemon, unpaired: it would go to whatsapp for a qr
          for host in web.whatsapp.com g.whatsapp.net v.whatsapp.net mmg.whatsapp.net mmg-fallback.whatsapp.net \
            pps.whatsapp.net static.whatsapp.net whatsapp.com www.whatsapp.com api.whatsapp.com chat.whatsapp.com \
            rupload.facebook.com; do
            printf '0.0.0.0 %s\n:: %s\n' "$host" "$host" | sudo tee -a /etc/hosts >/dev/null
          done
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder
          if curl -sS --max-time 10 -o /dev/null https://web.whatsapp.com; then
            echo 'web.whatsapp.com still reachable, not starting the daemon'
            exit 1
          fi
          logs="$HOME/Library/Logs/in.codelif.whatevr"
          trap 'tail -n 200 "$logs"/daemon/*.log 2>/dev/null || true' EXIT
          bin="$(brew --prefix)/bin"
          "$bin/whatevrd" service enable
          launchctl print "gui/$(id -u)/in.codelif.whatevr.daemon" >/dev/null
          "$bin/whatevrd" frontend list
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$lsregister" -u build/release/Whatevr.app build/debug/Whatevr.app || true
          "$lsregister" -f /Applications/Whatevr.app
          # a bare link with no frontend up starts the default one, whattui in terminal
          open 'whatevr://'
          for _ in $(seq 60); do
            if "$bin/whatevrd" frontend list | grep -Eq '^whattui .*connected'; then break; fi
            sleep 1
          done
          "$bin/whatevrd" frontend list | grep -E '^whattui .*connected'
          pid="$(launchctl print "gui/$(id -u)/in.codelif.whatevr.daemon" | awk '/^\tpid = / { print $3 }')"
          test -n "$pid"
          if lsof -nP -a -p "$pid" -iTCP -sTCP:ESTABLISHED; then
            echo 'the daemon holds a tcp connection'
            exit 1
          fi
          pkill -x whattui || true
          pkill -x Terminal || true
      - name: Uninstall and zap the cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew uninstall --cask --zap local/test/whatevr
          if launchctl print "gui/$(id -u)/in.codelif.whatevr.daemon" >/dev/null 2>&1; then
            echo 'the login service is still loaded'
            exit 1
          fi
          test ! -e "$HOME/Library/LaunchAgents/in.codelif.whatevr.daemon.plist"
          test ! -e /Applications/Whatevr.app
          test ! -e "$(brew --prefix)/bin/whatevrd"
          test ! -e "$(brew --prefix)/bin/whattui"
          for dir in "Application Support" Caches Logs; do
            test ! -e "$HOME/Library/$dir/in.codelif.whatevr"
          done

  aur:
    name: AUR metadata
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    needs: changes
    if: ${{ needs.changes.outputs.aur == 'true' }}
    steps:
      - name: Install packaging tools
        run: |
          pacman -Syu --noconfirm --needed git sudo base-devel namcap
          useradd -m -G wheel builduser
          printf 'builduser ALL=(ALL) NOPASSWD: ALL\n' >> /etc/sudoers

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check package metadata
        run: |
          chown -R builduser:builduser "$GITHUB_WORKSPACE"
          for dir in "$GITHUB_WORKSPACE"/packaging/aur/*; do
            cd "$dir"
            sudo -u builduser makepkg --printsrcinfo > .SRCINFO.generated
            diff -u .SRCINFO .SRCINFO.generated
            namcap PKGBUILD
          done
