edition = "2024";

package whatevr.v2;

import "whatevr/v2/people.proto";

option features.field_presence = IMPLICIT;

// a group's facts, no members; group_members has those
message GroupView {
  string chat_id = 1;
}

message GroupRow {
  string chat_id = 1;
  string subject = 2;
  string description = 3;
  string avatar_path = 4;
  int64 created_ms = 5;
  Person owner = 6;
  uint32 member_count = 7;
  GroupRole my_role = 8;
  // only admins send
  bool announce = 9;
  // only admins edit the group's info
  bool locked = 10;
  // joining needs an admin's approval
  bool approval = 11;
  // the community this group belongs to
  string community_id = 12;
  // why whatsapp wouldn't describe it, empty when it did
  string error = 13;
}

message GroupMembersView {
  string chat_id = 1;
}

message GroupMemberRow {
  Person person = 1;
  GroupRole role = 2;
}

enum GroupRole {
  GROUP_ROLE_UNSPECIFIED = 0;
  GROUP_ROLE_MEMBER = 1;
  GROUP_ROLE_ADMIN = 2;
  GROUP_ROLE_SUPERADMIN = 3;
  // not in the group any more
  GROUP_ROLE_LEFT = 4;
}

// creates a group with an optional member list and photo; answers the chat
message GroupCreate {
  string name = 1;
  repeated string members = 2;
  string photo_path = 3;
}

message GroupCreateResult {
  string chat_id = 1;
}

message GroupLeave {
  string chat_id = 1;
}

message GroupSetName {
  string chat_id = 1;
  string name = 2;
}

message GroupSetTopic {
  string chat_id = 1;
  string description = 2;
}

message GroupSetPhoto {
  string chat_id = 1;
  // empty clears the photo, otherwise a local file to upload
  string path = 2;
}

message GroupInviteLink {
  string chat_id = 1;
  bool reset = 2;
}

message GroupInviteLinkResult {
  string link = 1;
}

message GroupMembers {
  string chat_id = 1;
  // one of add, remove, promote, demote
  string action = 2;
  repeated string members = 3;
}

message GroupSetAnnounce {
  string chat_id = 1;
  bool enabled = 2;
}

message GroupSetLocked {
  string chat_id = 1;
  bool enabled = 2;
}

message CommunityLink {
  string community_id = 1;
  string group_id = 2;
}

message CommunityUnlink {
  string community_id = 1;
  string group_id = 2;
}
